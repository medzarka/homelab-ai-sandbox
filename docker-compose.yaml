services:
  # ========================================================
  # WORKSPACE INITIALIZER (zap-srv & oci01-flex)
  # ========================================================
  sandbox-workspace-init:
    image: alpine:latest
    container_name: compute_sandbox_workspace_init
    user: "0:0"
    restart: unless-stopped
    network_mode: none
    volumes:
      - ${WORKSPACE_DIR:-/srv/data/workspace}:/workspace
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo ">>> [Sandbox Workspace Init] Preparing directories in ${WORKSPACE_DIR:-/srv/data/workspace}..."
        mkdir -p /workspace/sandbox /workspace/logs
        chmod -R 777 /workspace
        echo ">>> [Sandbox Workspace Init] Storage initialization complete. Guard active."
        sleep infinity
    healthcheck:
      test: ["CMD-SHELL", "test -d /workspace/sandbox || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ========================================================
  # AGENT EXECUTION SANDBOX (Headless REST Execution API)
  # Multi-Node High Availability (zap-srv & oci01-flex)
  # ========================================================
  agent-sandbox:
    build:
      context: ./agent-sandbox
      dockerfile: Dockerfile
    image: ghcr.io/medzarka/homelab-ai-sandbox:latest
    container_name: compute_agent_sandbox
    restart: unless-stopped
    depends_on:
      sandbox-workspace-init:
        condition: service_healthy
    volumes:
      - ${WORKSPACE_DIR:-/srv/data/workspace}/sandbox:/workspace/sandbox
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - SANDBOX_DIR=/workspace/sandbox
      - SANDBOX_API_KEY=${SANDBOX_API_KEY:-}
      - PYTHON_VERSION=${PYTHON_VERSION:-3.12}
      - JAVA_VERSION=${JAVA_VERSION:-21}
      - SESSION_TTL=${SESSION_TTL:-3600}
      - SANDBOX_DOMAIN=${SANDBOX_DOMAIN:-sandbox.local}
      - OMP_NUM_THREADS=${OMP_NUM_THREADS:-12}
      - RAYON_NUM_THREADS=${RAYON_NUM_THREADS:-12}
    # No host ports mapped. Access is strictly through Swarm overlay DNS or Traefik gateway.
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8088/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      mode: replicated
      replicas: ${SANDBOX_REPLICAS:-1}
      placement:
        preferences:
          - spread: node.hostname
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 60s
      resources:
        limits:
          memory: 4096M
        reservations:
          memory: 512M
    labels:
      - traefik.enable=true
      - traefik.http.routers.agent-sandbox.rule=Host(`${SANDBOX_DOMAIN:-sandbox.example.com}`)
      - traefik.http.routers.agent-sandbox.entrypoints=websecure
      - traefik.http.routers.agent-sandbox.tls=true
      - traefik.http.routers.agent-sandbox.middlewares=app-fail2ban@file,security-headers@file
      - traefik.http.services.agent-sandbox.loadbalancer.server.port=8088
      - traefik.http.services.agent-sandbox.loadbalancer.healthcheck.path=/health
      - traefik.http.services.agent-sandbox.loadbalancer.healthcheck.interval=5s
      - traefik.http.services.agent-sandbox.loadbalancer.healthcheck.timeout=2s
      - traefik.docker.network=${SWARM_NETWORK:-homelab_swarm_net}
    networks:
      shared_net:
        aliases:
          - compute_agent_sandbox
          - agent-sandbox
          - agent-sandbox-${NODE_NAME:-node}
      homelab_swarm_net:
        aliases:
          - compute_agent_sandbox
          - agent-sandbox
          - agent-sandbox-${NODE_NAME:-node}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  shared_net:
    external: true
    name: ${SHARED_NETWORK:-shared_net}
  homelab_swarm_net:
    external: true
    name: ${SWARM_NETWORK:-homelab_swarm_net}
